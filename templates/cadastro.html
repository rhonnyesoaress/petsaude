{% extends 'layout.html' %}

{% block content %}
<div class="login-container">
    <div class="card">
        <h2>👤 Novo Cadastro</h2>
        <p>Crie sua conta para acessar o sistema.</p>
        
        <form method="POST" action="{{ url_for('cadastro') }}">
            
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" class="form-control" pattern="[^0-9]*"
                    oninput="this.value = this.value.replace(/[0-9]/g, ''); this.setCustomValidity('');"
                    oninvalid="this.classList.add('touched'); this.setCustomValidity('O nome não pode conter números.');"
                    onblur="this.classList.add('touched')" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF (apenas números)</label>
                <input type="text" id="cpf" name="cpf" class="form-control" maxlength="14" inputmode="numeric" placeholder="000.000.000-00"
                    oninput="this.value = this.value.replace(/\D/g, '').slice(0, 11); this.setCustomValidity(this.value.length === 11 && !cpfValido(this.value) ? 'CPF inválido.' : '');"
                    oninvalid="this.classList.add('touched'); this.setCustomValidity(this.value.length !== 11 || !cpfValido(this.value) ? 'CPF inválido.' : '');"
                    onblur="this.classList.add('touched')" required>
            </div>

            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento" class="form-control"
                    min="{{ data_min_nascimento }}" max="{{ data_max_nascimento }}"
                    oninvalid="this.classList.add('touched'); this.setCustomValidity(this.validity.rangeUnderflow ? 'A data precisa ser mais recente.' : this.validity.rangeOverflow ? 'A data de nascimento não pode ser uma data futura.' : '');"
                    oninput="this.setCustomValidity('')"
                    onblur="this.classList.add('touched')" required>
            </div>

            <div class="form-group">
                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo" class="form-control" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Transgênero">Transgênero</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" class="form-control" maxlength="9" inputmode="numeric" placeholder="00000-000"
                    oninput="this.value = this.value.replace(/\D/g, '').slice(0, 8); this.setCustomValidity('');"
                    onblur="this.classList.add('touched'); buscarCep(this);"
                    oninvalid="this.classList.add('touched'); this.setCustomValidity(this.value.length !== 8 ? 'CEP inválido.' : this.validationMessage || 'CEP inválido.');"
                    required>
            </div>

            <div class="form-group">
                <label for="rua">Rua</label>
                <input type="text" id="rua" name="rua" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" class="form-control" required>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" name="estado" class="form-control" maxlength="2" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Defina uma Senha</label>
                <input type="password" id="senha" name="senha" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="confirmar_senha">Confirme a Senha</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Grupo de Risco (Selecione todos que se aplicam):</label>
                
                <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 5px;">
                    <div style="display: flex; align-items: center;">
                        <input type="checkbox" id="hipertenso" name="grupo_risco" value="Hipertenso" style="width: auto; margin-right: 5px;">
                        <label for="hipertenso" style="margin: 0; font-weight: normal;">Hipertenso</label>
                    </div>

                    <div style="display: flex; align-items: center;">
                        <input type="checkbox" id="diabetico" name="grupo_risco" value="Diabético" style="width: auto; margin-right: 5px;">
                        <label for="diabetico" style="margin: 0; font-weight: normal;">Diabético</label>
                    </div>

                    <div style="display: flex; align-items: center;">
                        <input type="checkbox" id="sem_comorbidade" name="grupo_risco" value="Sem comorbidade" style="width: auto; margin-right: 5px;">
                        <label for="sem_comorbidade" style="margin: 0; font-weight: normal;">Sem comorbidade</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
        
        <hr style="margin: 20px 0 10px 0; border-top: 1px solid #eee;">
        <p style="text-align: center; margin: 0;">
            Já tem uma conta? <a href="{{ url_for('login') }}">Faça login aqui</a>
        </p>
    </div>
</div>

<script>
    function cpfValido(cpf) {
        cpf = cpf.replace(/\D/g, '');
        if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;

        let soma = 0;
        for (let i = 0; i < 9; i++) soma += parseInt(cpf[i]) * (10 - i);
        let resto = (soma * 10) % 11;
        if (resto === 10) resto = 0;
        if (resto !== parseInt(cpf[9])) return false;

        soma = 0;
        for (let i = 0; i < 10; i++) soma += parseInt(cpf[i]) * (11 - i);
        resto = (soma * 10) % 11;
        if (resto === 10) resto = 0;
        return resto === parseInt(cpf[10]);
    }

    function buscarCep(input) {
        const cep = input.value;
        const rua = document.getElementById('rua');
        const bairro = document.getElementById('bairro');
        const estado = document.getElementById('estado');

        if (cep.length !== 8) {
            input.setCustomValidity('CEP inválido.');
            return;
        }

        fetch(`https://viacep.com.br/ws/${cep}/json/`)
            .then(function (resposta) { return resposta.json(); })
            .then(function (dados) {
                if (dados.erro) {
                    input.setCustomValidity('CEP inválido.');
                    rua.value = '';
                    bairro.value = '';
                    estado.value = '';
                } else {
                    input.setCustomValidity('');
                    rua.value = dados.logradouro || '';
                    bairro.value = dados.bairro || '';
                    estado.value = dados.uf || '';
                }
            })
            .catch(function () {
                input.setCustomValidity('Não foi possível validar o CEP. Tente novamente.');
            });
    }

    document.addEventListener('DOMContentLoaded', function() {
        const checkSemComorbidade = document.getElementById('sem_comorbidade');
        const checkHipertenso = document.getElementById('hipertenso');
        const checkDiabetico = document.getElementById('diabetico');
        
        // Lista com as doenças (excluindo o "sem comorbidade")
        const doencas = [checkHipertenso, checkDiabetico];

        // 1. Se clicar em "Sem comorbidade", desmarca os outros
        checkSemComorbidade.addEventListener('change', function() {
            if (this.checked) {
                doencas.forEach(checkbox => checkbox.checked = false);
            }
        });

        // 2. Se clicar em alguma doença, desmarca "Sem comorbidade"
        doencas.forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                if (this.checked) {
                    checkSemComorbidade.checked = false;
                }
            });
        });
    });
</script>
{% endblock %}
